<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Huayra playground</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --panel: #12121a;
      --border: #2a2a36;
      --text: #e8e8ef;
      --muted: #8b8b9a;
      --accent: #7aa2f7;
      --ok: #9ece6a;
      --warn: #e0af68;
      --err: #f7768e;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.45;
    }
    #app {
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      height: 100%;
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header .brand { font-weight: 600; letter-spacing: 0.04em; }
    header .credit { color: var(--muted); margin-left: auto; font-size: 11px; }
    header a { color: var(--accent); text-decoration: none; }
    header a:hover { text-decoration: underline; }
    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: #0e0e14;
      font-size: 12px;
      color: var(--muted);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.err { background: var(--err); }
    #session-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      overflow-x: auto;
      min-height: 36px;
    }
    #session-bar .label {
      color: var(--muted);
      font-size: 11px;
      flex-shrink: 0;
    }
    #session-list {
      display: flex;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .session-chip {
      flex-shrink: 0;
      font: inherit;
      font-size: 11px;
      background: #1a1a28;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
    }
    .session-chip.active {
      color: var(--text);
      border-color: var(--accent);
    }
    #session-new {
      flex-shrink: 0;
      font: inherit;
      font-size: 11px;
      background: #1a1a28;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 10px;
      cursor: pointer;
    }
    #log {
      overflow: auto;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin: 0 0 6px; }
    .line.sys { color: var(--muted); }
    .line.user { color: var(--accent); }
    .line.assistant { color: var(--text); }
    .line.err { color: var(--err); }
    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 10px 14px;
    }
    #prompt-form {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #prompt {
      flex: 1;
      resize: vertical;
      min-height: 44px;
      max-height: 160px;
      background: #0b0b0f;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }
    #prompt:focus { outline: 1px solid var(--accent); }
    #send {
      font: inherit;
      background: #1a1a28;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: default; }
    #gate {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    #gate.open { display: flex; }
    #gate .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      width: min(360px, 92vw);
    }
    #gate label { display: block; margin-bottom: 6px; color: var(--muted); }
    #gate input {
      width: 100%;
      background: #0b0b0f;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      margin-bottom: 12px;
    }
    #gate .actions { display: flex; gap: 8px; justify-content: flex-end; }
    #gate button {
      font: inherit;
      background: #1a1a28;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="brand">HUAYRA</span>
      <span class="credit">Charles <a href="https://x.com/zanneth" target="_blank" rel="noopener">@zanneth</a> · MIT · fork qxlsz</span>
    </header>
    <div class="status-row" aria-live="polite">
      <span class="pill"><span id="opencode-dot" class="dot"></span><span id="opencode-label">OpenCode …</span></span>
      <span class="pill"><span id="provider-dot" class="dot"></span><span id="provider-label">provider none</span></span>
      <span class="pill"><span id="agent-dot" class="dot"></span><span id="agent-label">agent —</span></span>
      <span class="pill"><span id="model-dot" class="dot"></span><span id="model-label">model —</span></span>
      <span class="pill"><span id="thinking-dot" class="dot"></span><span id="thinking-label">thinking idle</span></span>
      <span class="pill"><span id="gate-dot" class="dot"></span><span id="gate-label">gate off</span></span>
      <span class="pill"><span id="session-dot" class="dot ok"></span><span id="session-label">session 1</span></span>
    </div>
    <div id="session-bar" aria-label="Session index">
      <span class="label">sessions</span>
      <div id="session-list"></div>
      <button type="button" id="session-new" title="New session">new</button>
    </div>
    <div id="log" role="log"></div>
    <footer>
      <form id="prompt-form">
        <textarea id="prompt" rows="2" placeholder="prompt" autocomplete="off" spellcheck="false"></textarea>
        <button type="submit" id="send">send</button>
      </form>
    </footer>
  </div>

  <div id="gate" aria-hidden="true">
    <div class="card">
      <label for="phrase">host gate (optional)</label>
      <input id="phrase" type="password" autocomplete="current-password" placeholder="passphrase"/>
      <div class="actions">
        <button type="button" id="gate-skip">skip</button>
        <button type="button" id="gate-unlock">unlock</button>
      </div>
    </div>
  </div>

  <script type="module">
    const OPENCODE_DEFAULT = "http://127.0.0.1:4096";
    const SESSION_STORE_KEY = "huayra.playground.sessions.v1";
    const logEl = document.getElementById("log");
    const form = document.getElementById("prompt-form");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const opencodeDot = document.getElementById("opencode-dot");
    const opencodeLabel = document.getElementById("opencode-label");
    const providerDot = document.getElementById("provider-dot");
    const providerLabel = document.getElementById("provider-label");
    const agentDot = document.getElementById("agent-dot");
    const agentLabel = document.getElementById("agent-label");
    const modelDot = document.getElementById("model-dot");
    const modelLabel = document.getElementById("model-label");
    const thinkingDot = document.getElementById("thinking-dot");
    const thinkingLabel = document.getElementById("thinking-label");
    const gateDot = document.getElementById("gate-dot");
    const gateLabel = document.getElementById("gate-label");
    const sessionDot = document.getElementById("session-dot");
    const sessionLabel = document.getElementById("session-label");
    const sessionListEl = document.getElementById("session-list");
    const sessionNewBtn = document.getElementById("session-new");
    const gateOverlay = document.getElementById("gate");
    const phraseInput = document.getElementById("phrase");

    let provider = "none";
    let opencodeUrl = OPENCODE_DEFAULT;
    let opencodeReachable = false;
    let activeModel = null;
    let unlocked = true;
    let probeTimer = null;

    /** @type {{ id: string, title: string, created: number, lines: { cls: string, text: string }[] }[]} */
    let sessions = [];
    let activeSessionId = null;
    let suppressPersist = false;

    function uid() {
      return `s_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function loadSessions() {
      try {
        const raw = localStorage.getItem(SESSION_STORE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.sessions) || typeof data.activeId !== "string") return null;
        const cleaned = data.sessions.filter(
          (s) => s && typeof s.id === "string" && Array.isArray(s.lines),
        );
        if (!cleaned.length) return null;
        return { sessions: cleaned, activeId: data.activeId };
      } catch {
        return null;
      }
    }

    function persistSessions() {
      if (suppressPersist) return;
      try {
        localStorage.setItem(
          SESSION_STORE_KEY,
          JSON.stringify({ sessions, activeId: activeSessionId }),
        );
      } catch {
        // quota or private mode
      }
    }

    function activeSession() {
      return sessions.find((s) => s.id === activeSessionId) || null;
    }

    function renderSessionBar() {
      sessionListEl.replaceChildren();
      for (const s of sessions) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "session-chip" + (s.id === activeSessionId ? " active" : "");
        btn.textContent = s.title || "session";
        btn.title = s.title || s.id;
        btn.addEventListener("click", () => switchSession(s.id));
        sessionListEl.appendChild(btn);
      }
      const active = activeSession();
      const idx = sessions.findIndex((s) => s.id === activeSessionId) + 1;
      sessionLabel.textContent = active
        ? `session ${idx}/${sessions.length}`
        : "session —";
      sessionDot.className = "dot ok";
    }

    function paintLogFromSession(session) {
      suppressPersist = true;
      logEl.replaceChildren();
      for (const entry of session.lines) {
        const p = document.createElement("div");
        p.className = `line ${entry.cls}`;
        p.textContent = entry.text;
        logEl.appendChild(p);
      }
      logEl.scrollTop = logEl.scrollHeight;
      suppressPersist = false;
    }

    function switchSession(id) {
      const next = sessions.find((s) => s.id === id);
      if (!next || next.id === activeSessionId) return;
      activeSessionId = next.id;
      paintLogFromSession(next);
      renderSessionBar();
      persistSessions();
    }

    function createSession(opts = {}) {
      const session = {
        id: uid(),
        title: opts.title || `session ${sessions.length + 1}`,
        created: Date.now(),
        lines: [],
      };
      sessions.push(session);
      activeSessionId = session.id;
      paintLogFromSession(session);
      renderSessionBar();
      persistSessions();
      return session;
    }

    function ensureSession() {
      if (activeSession()) return activeSession();
      const loaded = loadSessions();
      if (loaded) {
        sessions = loaded.sessions;
        activeSessionId = loaded.sessions.some((s) => s.id === loaded.activeId)
          ? loaded.activeId
          : loaded.sessions[loaded.sessions.length - 1].id;
        paintLogFromSession(activeSession());
        renderSessionBar();
        return activeSession();
      }
      return createSession({ title: "session 1" });
    }

    function line(cls, text) {
      const p = document.createElement("div");
      p.className = `line ${cls}`;
      p.textContent = text;
      logEl.appendChild(p);
      logEl.scrollTop = logEl.scrollHeight;
      const session = activeSession();
      if (session && !suppressPersist) {
        session.lines.push({ cls, text });
        if (cls === "user" && session.lines.filter((l) => l.cls === "user").length === 1) {
          const title = text.replace(/^>\s*/, "").trim().slice(0, 40);
          if (title) session.title = title;
          renderSessionBar();
        }
        persistSessions();
      }
    }

    function setOpenCodeStatus(state, detail) {
      opencodeDot.className = "dot " + (state === "ok" ? "ok" : state === "warn" ? "warn" : state === "err" ? "err" : "");
      opencodeLabel.textContent = detail;
    }

    function setModelStatus(name) {
      activeModel = name || null;
      if (activeModel) {
        modelDot.className = "dot ok";
        modelLabel.textContent = `model ${activeModel}`;
      } else {
        modelDot.className = "dot";
        modelLabel.textContent = "model —";
      }
    }

    function setAgentStatus(name) {
      if (name) {
        agentDot.className = "dot ok";
        agentLabel.textContent = `agent ${name}`;
      } else {
        agentDot.className = "dot";
        agentLabel.textContent = "agent —";
      }
    }

    function sessionHistoryToMessages(session, latestUserText) {
      const messages = [];
      if (session && Array.isArray(session.lines)) {
        for (const entry of session.lines) {
          if (!entry || typeof entry.text !== "string") continue;
          if (entry.cls === "user") {
            const content = entry.text.replace(/^>\s*/, "");
            if (content) messages.push({ role: "user", content });
          } else if (entry.cls === "assistant") {
            messages.push({ role: "assistant", content: entry.text });
          }
        }
      }
      // line() already appended the latest user turn; avoid double-append if called before line
      if (latestUserText && (messages.length === 0 || messages[messages.length - 1].role !== "user" || messages[messages.length - 1].content !== latestUserText)) {
        messages.push({ role: "user", content: latestUserText });
      }
      return messages;
    }

    function setThinking(busy) {
      if (busy) {
        thinkingDot.className = "dot warn";
        thinkingLabel.textContent = "thinking…";
      } else {
        thinkingDot.className = "dot";
        thinkingLabel.textContent = "thinking idle";
      }
    }

    async function fetchWithTimeout(url, opts, ms) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, { ...opts, signal: controller.signal });
        clearTimeout(timer);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    async function resolveOpenCodeModel() {
      try {
        const res = await fetchWithTimeout(
          opencodeUrl + "/v1/models",
          { method: "GET", mode: "cors" },
          1200,
        );
        if (!res.ok) return null;
        const data = await res.json();
        const list = Array.isArray(data?.data) ? data.data : Array.isArray(data) ? data : [];
        const first = list[0];
        const id = first?.id || first?.name || first?.model;
        return typeof id === "string" && id.trim() ? id.trim() : null;
      } catch {
        return null;
      }
    }

    function stopProbeTimer() {
      if (probeTimer != null) {
        clearInterval(probeTimer);
        probeTimer = null;
      }
    }

    function startProbeTimer() {
      if (probeTimer != null) return;
      // Re-probe while unreachable so attach happens without a full reload.
      probeTimer = setInterval(() => {
        if (!opencodeReachable) probeOpenCode({ quiet: true });
      }, 12000);
    }

    async function probeOpenCode(opts = {}) {
      const quiet = !!opts.quiet;
      if (!quiet) setOpenCodeStatus("", "OpenCode probing…");
      if (!quiet) setModelStatus(null);
      const paths = ["/health", "/v1/models", "/"];
      for (const path of paths) {
        try {
          const res = await fetchWithTimeout(
            opencodeUrl + path,
            { method: "GET", mode: "cors" },
            1200,
          );
          // Any response from the loopback server counts as reachable.
          if (res.status >= 200 && res.status < 500) {
            opencodeReachable = true;
            provider = "opencode";
            providerDot.className = "dot ok";
            providerLabel.textContent = "provider opencode";
            setOpenCodeStatus("ok", `OpenCode ${opencodeUrl}`);
            setAgentStatus("opencode");
            const model = await resolveOpenCodeModel();
            setModelStatus(model || "opencode");
            stopProbeTimer();
            if (!quiet) {
              line("sys", `attached OpenCode at ${opencodeUrl}` + (model ? ` · ${model}` : ""));
            } else {
              line("sys", `OpenCode became reachable · ${opencodeUrl}` + (model ? ` · ${model}` : ""));
            }
            return;
          }
        } catch {
          // try next path
        }
      }
      opencodeReachable = false;
      provider = "none";
      providerDot.className = "dot";
      providerLabel.textContent = "provider none";
      setOpenCodeStatus("warn", `OpenCode unreachable (${opencodeUrl})`);
      if (!quiet) {
        setModelStatus(null);
        setAgentStatus(null);
      }
      startProbeTimer();
    }

    async function sendPrompt(text) {
      line("user", `> ${text}`);
      if (provider === "opencode" && opencodeReachable) {
        sendBtn.disabled = true;
        setThinking(true);
        try {
          const messages = sessionHistoryToMessages(activeSession(), text);
          const res = await fetch(opencodeUrl + "/v1/chat/completions", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              model: activeModel || "opencode",
              messages,
              stream: false,
            }),
          });
          if (!res.ok) {
            const body = await res.text().catch(() => "");
            throw new Error(`OpenCode ${res.status} ${body.slice(0, 200)}`);
          }
          const data = await res.json();
          const content =
            data?.choices?.[0]?.message?.content ??
            data?.message?.content ??
            JSON.stringify(data).slice(0, 500);
          line("assistant", String(content));
        } catch (err) {
          line("err", `OpenCode request failed: ${err.message || err}`);
        } finally {
          sendBtn.disabled = false;
          setThinking(false);
        }
        return;
      }
      line("sys", "no engine attached; local echo");
      line("assistant", text);
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!unlocked) {
        gateOverlay.classList.add("open");
        gateOverlay.setAttribute("aria-hidden", "false");
        return;
      }
      const text = promptEl.value.trim();
      if (!text) return;
      promptEl.value = "";
      sendPrompt(text);
    });

    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    sessionNewBtn.addEventListener("click", () => {
      const n = sessions.length + 1;
      createSession({ title: `session ${n}` });
      line("sys", `new session ${n}`);
      line("sys", "Credit: Charles @zanneth · MIT");
    });

    document.getElementById("gate-skip").addEventListener("click", () => {
      unlocked = true;
      gateOverlay.classList.remove("open");
      gateOverlay.setAttribute("aria-hidden", "true");
      gateDot.className = "dot";
      gateLabel.textContent = "gate off";
    });

    document.getElementById("gate-unlock").addEventListener("click", () => {
      const phrase = phraseInput.value;
      if (!phrase) {
        line("err", "empty passphrase");
        return;
      }
      unlocked = true;
      phraseInput.value = "";
      gateOverlay.classList.remove("open");
      gateOverlay.setAttribute("aria-hidden", "true");
      gateDot.className = "dot ok";
      gateLabel.textContent = "gate local";
      line("sys", "host gate accepted (client-side only in playground)");
    });

    // First paint is never blocked by gate or OpenCode probe.
    ensureSession();
    if (!activeSession().lines.length) {
      line("sys", "Huayra playground ready");
      line("sys", "Credit: Charles @zanneth · MIT");
    }
    probeOpenCode();
  </script>
</body>
</html>
